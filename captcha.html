<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflux IQ verification</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    /* Deliberately opaque, not transparent — a transparent WKWebView background makes
       Cloudflare's challenge iframe render unreliably on iOS (it can silently get stuck
       mid-render even though the JS callback still fires). A plain white box also matches
       how most apps present a captcha regardless of their own light/dark theme. */
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div
    class="cf-turnstile"
    data-sitekey="0x4AAAAAAFLlcazyVohISOsh"
    data-callback="onTurnstileSuccess"
    data-error-callback="onTurnstileError"
    data-expired-callback="onTurnstileExpired"
    data-theme="auto">
  </div>
  <script>
    function post(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      }
    }
    function onTurnstileSuccess(token) {
      post({ type: 'token', token: token });
    }
    function onTurnstileError() {
      post({ type: 'error' });
    }
    function onTurnstileExpired() {
      post({ type: 'expired' });
    }
    // Belt-and-suspenders: if Cloudflare's script never finishes loading/rendering at all
    // (network hiccup, the widget script blocked, etc.), don't leave the app waiting forever
    // on a blank box — report a failure after a timeout so it can offer a retry.
    setTimeout(function () {
      if (!document.querySelector('.cf-turnstile iframe')) {
        post({ type: 'error' });
      }
    }, 10000);
  </script>
</body>
</html>
